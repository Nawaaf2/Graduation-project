<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كلمة مرور جديدة — مُفكّرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="noise-overlay"></div>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🔐</div>
      <h1 class="auth-title" style="text-align:center;">كلمة مرور جديدة</h1>
      <p class="auth-sub" style="text-align:center; margin-bottom:28px;">اختر كلمة مرور قوية</p>

      <div id="np-error"   class="error-msg"></div>
      <div id="np-success" class="success-msg"></div>

      <div class="form-group">
        <label class="form-label">كلمة المرور الجديدة</label>
        <input type="password" id="new-password" class="form-input" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label class="form-label">تأكيد كلمة المرور</label>
        <input type="password" id="confirm-password" class="form-input" placeholder="••••••••"/>
      </div>

      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="handleReset()">
        <i class="fa-solid fa-lock" style="margin-left:8px;"></i>
        حفظ كلمة المرور
      </button>
    </div>
  </div>

<script src="js/ui.js"></script>
<script src="js/pages/new-password.js"></script>
</body>
</html>
