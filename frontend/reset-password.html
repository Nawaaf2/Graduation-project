<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
  if (localStorage.getItem('mufakkira_theme') === 'light') {
    document.documentElement.classList.add('light');
  }
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إعادة تعيين كلمة المرور — مُفكّرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="noise-overlay"></div>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div id="step-email">
        <div class="auth-logo"><i class="fa-solid fa-sack-dollar"></i></div>
        <h1 class="auth-title" style="text-align:center;">نسيت كلمة المرور؟</h1>
        <p class="auth-sub" style="text-align:center; margin-bottom:28px;">
          أدخل بريدك الإلكتروني وراح نرسل لك رابط الاسترداد
        </p>

        <div id="email-error" class="error-msg"></div>
        <div id="email-success" class="success-msg"></div>

        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" id="email-input" class="form-input" placeholder="example@email.com" dir="ltr" style="text-align:right;"/>
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="handleSendEmail()">
          <i class="fa-solid fa-paper-plane" style="margin-left:8px;"></i>
          إرسال رابط الاسترداد
        </button>

        <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-3);">
          تذكّرت كلمة المرور؟ <a href="login.html" class="link">تسجيل الدخول</a>
        </p>
      </div>

      <div id="step-sent" style="display:none;">
        <div class="auth-logo">📬</div>
        <h1 class="auth-title" style="text-align:center;">تم الإرسال!</h1>
        <p class="auth-sub" style="text-align:center; margin-bottom:24px;">
          أرسلنا رابط إعادة تعيين كلمة المرور إلى
        </p>
        <p id="sent-email-display" style="text-align:center; font-weight:600; color:var(--accent); margin-bottom:28px; font-size:15px; direction:ltr;"></p>

        <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 20px; margin-bottom:24px;">
          <p style="font-size:13px; color:var(--text-2); line-height:1.8;">
            <i class="fa-solid fa-circle-info" style="color:var(--accent); margin-left:6px;">
              </i>
            تحقق من صندوق الوارد أو مجلد الـ Spam. الرابط صالح لمدة <strong style="color:var(--text-1);">30 دقيقة</strong>.
          </p>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="resendEmail()">
          <i class="fa-solid fa-rotate-right" style="margin-left:8px;"></i>
          إعادة إرسال الرابط
        </button>

        <p style="text-align:center; margin-top:16px; font-size:14px; color:var(--text-3);">
          <a href="login.html" class="link">
            <i class="fa-solid fa-arrow-right" style="margin-left:4px;"></i>
            الرجوع لتسجيل الدخول
          </a>
        </p>
      </div>

    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body>
</html>
