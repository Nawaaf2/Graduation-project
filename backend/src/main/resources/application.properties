# ===== قاعدة البيانات =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== السيرفر =====
server.port=8080

# ===== JWT =====
app.jwt.secret=crRbXyQ9no+3pvAJgxKVusAisHWUTCTtb1Ytz5op6Vy2TmpBC+c7DdzWSMyYHSbn/lp0Va7qfO1eDe5Gvuu8OQ==
app.jwt.expiration=86400000


# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

# ===== Mail (Resend) =====
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
